<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MUSAFIQ: Smart AI Travel Planner & Tour Booking Dashboard." />
    <title>MUSAFIQ - AI Travel Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <audio id="musafiq-bg-audio" src="/audio/musafir.mp3" loop preload="auto" playsinline></audio>
    <script>
      (function() {
        try {
          var a = document.getElementById('musafiq-bg-audio');
          if (a) {
            a.volume = 0.25;
            var p = a.play();
            if (p !== undefined) {
              p.catch(function() {
                var trigger = function() {
                  a.play().catch(function() {});
                  ['click', 'pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function(ev) {
                    window.removeEventListener(ev, trigger, true);
                  });
                };
                ['click', 'pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function(ev) {
                  window.addEventListener(ev, trigger, { once: true, capture: true });
                });
              });
            }
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
